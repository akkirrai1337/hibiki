[package]
name = "wasmtime-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
spike-probes = ["dep:wat"]
android-production-jni = ["dep:jni"]
android-harness = ["android-production-jni", "spike-probes"]

[[bin]]
name = "wasmtime-spike-runner"
path = "src/main.rs"
required-features = ["spike-probes"]

[dependencies]
jni = { version = "0.21", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = "47.0.3"
wat = { version = "1.245.1", optional = true }
