[package]
name = "wasmtime-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
android-harness = ["dep:jni"]

[[bin]]
name = "wasmtime-spike-runner"
path = "src/main.rs"

[dependencies]
jni = { version = "0.21", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = "47.0.3"
wat = "1.245.1"
