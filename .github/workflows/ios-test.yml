name: iOS test

on:
  push:
    branches:
      - main
      - unified-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS targets and Simulator app
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-test]')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx6g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode compatible with Compose and Kotlin/Native
        shell: bash
        run: |
          selected=""
          for candidate in \
            /Applications/Xcode_26.3.0.app/Contents/Developer \
            /Applications/Xcode_26.3.app/Contents/Developer \
            /Applications/Xcode_26.0.app/Contents/Developer \
            /Applications/Xcode_16.4.app/Contents/Developer \
            /Applications/Xcode_16.3.app/Contents/Developer \
            /Applications/Xcode_16.2.app/Contents/Developer; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "No compatible Xcode developer directory is installed on the runner"
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile iOS targets and run JVM tests
        run: >-
          ./gradlew
          :parsers:compileKotlinIosX64
          :parsers:compileKotlinIosArm64
          :parsers:compileKotlinIosSimulatorArm64
          :shared:compileKotlinIosArm64
          :shared:compileKotlinIosSimulatorArm64
          :parsers:jvmTest

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
