name: iOS

on:
  push:
    branches:
      - main
      - unified-ui
    paths:
      - ".github/workflows/ios.yml"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "parsers/**"
      - "shared/**"
      - "iosApp/**"
  workflow_dispatch:
    inputs:
      prerelease:
        description: Create a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build iOS device IPA
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx6g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode compatible with Compose and Kotlin/Native
        shell: bash
        run: |
          selected=""
          for candidate in \
            /Applications/Xcode_26.3.0.app/Contents/Developer \
            /Applications/Xcode_26.3.app/Contents/Developer \
            /Applications/Xcode_26.0.app/Contents/Developer \
            /Applications/Xcode_16.4.app/Contents/Developer \
            /Applications/Xcode_16.3.app/Contents/Developer \
            /Applications/Xcode_16.2.app/Contents/Developer; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "No compatible Xcode developer directory is installed on the runner"
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine release version
        id: release
        shell: bash
        env:
          IS_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          BASE_VERSION=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "${BASE_VERSION:-}" ]; then
            echo "Could not read versionName from app/build.gradle.kts"
            exit 1
          fi

          if [[ ! "$BASE_VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Invalid versionName: $BASE_VERSION"
            exit 1
          fi

          TARGET_VERSION="$BASE_VERSION"
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$IS_PRERELEASE" = true ]; then
            EXISTING_PRERELEASE_FOR_COMMIT=$(
              git tag --points-at HEAD --list "v${TARGET_VERSION}-prerelease.*" |
                head -n 1 || true
            )
            if [ -n "${EXISTING_PRERELEASE_FOR_COMMIT:-}" ]; then
              echo "Commit HEAD has already been published as ${EXISTING_PRERELEASE_FOR_COMMIT}."
              exit 1
            fi

            LAST_PRERELEASE_NUMBER=$(
              git tag --list "v${TARGET_VERSION}-prerelease.*" |
                sed -nE "s/^v${TARGET_VERSION//./\\.}-prerelease\\.([0-9]+)$/\\1/p" |
                sort -nr |
                head -n 1 || true
            )
            if [ -n "${LAST_PRERELEASE_NUMBER:-}" ]; then
              PRERELEASE_NUMBER=$((LAST_PRERELEASE_NUMBER + 1))
            else
              PRERELEASE_NUMBER=1
            fi
            RELEASE_VERSION="${TARGET_VERSION}-prerelease.${PRERELEASE_NUMBER}"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_VERSION="$TARGET_VERSION"
          else
            RELEASE_VERSION="$TARGET_VERSION"
          fi

          TAG="v${RELEASE_VERSION}"
          if [ "$EVENT_NAME" = workflow_dispatch ] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Release tag ${TAG} already exists. Bump versionName before running the workflow."
            exit 1
          fi

          PREVIOUS_TAG=""
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$IS_PRERELEASE" = true ]; then
            PREVIOUS_TAG=$(
              git tag --list "v${TARGET_VERSION}-prerelease.*" --sort=-version:refname |
                head -n 1 || true
            )
          fi
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(
              git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags |
                grep -E '^v[0-9][0-9A-Za-z.+-]*$' |
                grep -v -- '-prerelease\.' |
                head -n 1 || true
            )
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD"
          fi

          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([ "$EVENT_NAME" = workflow_dispatch ] && echo "$IS_PRERELEASE" || echo false)" >> "$GITHUB_OUTPUT"

          {
            echo "## What's changed"
            echo
            git log --reverse --pretty=format:'%s' "$COMMIT_RANGE" |
              awk -v version="$TARGET_VERSION" '$0 != version && $0 != "v" version { print "- " $0 }'
            echo
            echo "## Package"
            echo
            echo "Unsigned iOS device IPA for signing and installation with Sideloadly or another signing tool."
          } > release-notes.md

      - name: Build unsigned iOS device archive
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/ios-archive.xcarchive
          MARKETING_VERSION=${{ steps.release.outputs.version }}
          CURRENT_PROJECT_VERSION=1
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          archive

      - name: Package unsigned iOS device IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios-archive.xcarchive/Products/Applications/iosApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "iOS device app was not created: $APP_PATH"
            exit 1
          fi

          mkdir -p release
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (
            cd build/ipa
            zip -qry "../../release/hibiki-v${{ steps.release.outputs.version }}-iphoneos.ipa" Payload
          )

      - name: Upload iOS device IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hibiki-v${{ steps.release.outputs.version }}-iphoneos
          path: release/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: v${{ steps.release.outputs.version }} iOS
          body_path: release-notes.md
          files: release/*.zip
          prerelease: ${{ steps.release.outputs.is_prerelease }}
