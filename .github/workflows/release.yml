# Cuts a release of both builds from one version - package.json's, which the desktop app, the web
# layer and the Android build (android/app/build.gradle) all read - and publishes them together as
# one GitHub Release: the Windows NSIS installer and the signed Android APK. Either can be left out
# from the run form. (build-macos.yml stays separate and only uploads its .dmg as an artifact.)
#
# Deliberately workflow_dispatch-only: cutting a release is a decision, not something a push should
# do on its own.
#
# The Android build is signed with the Kotlin Hibiki's key, from the same secrets that repository
# uses: HIBIKI_RELEASE_KEYSTORE_BASE64 (base64 of the keystore file), HIBIKI_RELEASE_STORE_PASSWORD,
# HIBIKI_RELEASE_KEY_ALIAS and HIBIKI_RELEASE_KEY_PASSWORD - add them to this repository too.
#
# Both builds also take ANILIST_CLIENT_ID (the Kotlin Hibiki's secret of the same name) for AniList
# sign-in; without it they still build, with the sign-in hidden.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Create a prerelease
        required: true
        default: false
        type: boolean
      windows:
        description: Build the Windows installer
        required: true
        default: true
        type: boolean
      android:
        description: Build the Android APK
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Decide the version and the notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        # fetch-depth: 0 for the tags and history the version/changelog step below reads.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse an empty release
        if: ${{ !inputs.windows && !inputs.android }}
        run: |
          echo "Neither the Windows installer nor the Android APK was picked."
          exit 1

      - name: Determine release version
        id: release
        shell: bash
        env:
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # Read through node rather than by grepping package.json - it's the same value
          # electron-builder stamps into the installer and app.getVersion() reports at runtime,
          # so there's no chance of the two disagreeing.
          BASE_VERSION=$(node -p "require('./package.json').version")
          if [ -z "${BASE_VERSION:-}" ] || [ "$BASE_VERSION" = "undefined" ]; then
            echo "Could not read version from package.json"
            exit 1
          fi

          if [[ ! "$BASE_VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Invalid version: $BASE_VERSION"
            echo "Set a valid version in package.json before running the workflow."
            exit 1
          fi

          TARGET_VERSION="$BASE_VERSION"

          if [ "$IS_PRERELEASE" = true ]; then
            # Two prereleases from the same commit would be two different downloads of byte-identical
            # software, which makes "which build were you on?" unanswerable in a bug report.
            EXISTING_PRERELEASE_FOR_COMMIT=$(
              git tag --points-at HEAD --list "v${TARGET_VERSION}-prerelease.*" |
                head -n 1 ||
                true
            )
            if [ -n "${EXISTING_PRERELEASE_FOR_COMMIT:-}" ]; then
              echo "Commit HEAD has already been published as ${EXISTING_PRERELEASE_FOR_COMMIT}."
              echo "Refusing to create another prerelease from the same commit."
              exit 1
            fi

            LAST_PRERELEASE_NUMBER=$(
              git tag --list "v${TARGET_VERSION}-prerelease.*" |
                sed -nE "s/^v${TARGET_VERSION//./\\.}-prerelease\\.([0-9]+)$/\\1/p" |
                sort -nr |
                head -n 1 ||
                true
            )
            if [ -n "${LAST_PRERELEASE_NUMBER:-}" ]; then
              PRERELEASE_NUMBER=$((LAST_PRERELEASE_NUMBER + 1))
            else
              PRERELEASE_NUMBER=1
            fi
            RELEASE_VERSION="${TARGET_VERSION}-prerelease.${PRERELEASE_NUMBER}"
          else
            RELEASE_VERSION="$TARGET_VERSION"
          fi

          TAG="v${RELEASE_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Release tag ${TAG} already exists. Bump the version in package.json before running the workflow."
            exit 1
          fi

          # A prerelease's notes cover what changed since the *previous prerelease* of the same
          # version, if there is one - otherwise there'd be a growing, mostly-repeated changelog on
          # every prerelease of a version that takes a few rounds to settle.
          if [ "$IS_PRERELEASE" = true ]; then
            PREVIOUS_TAG=$(
              git tag --list "v${TARGET_VERSION}-prerelease.*" --sort=-version:refname |
                head -n 1 ||
                true
            )
          fi

          if [ -z "${PREVIOUS_TAG:-}" ]; then
            PREVIOUS_TAG=$(
              git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags |
                grep -E '^v[0-9][0-9A-Za-z.+-]*$' |
                grep -v -- '-prerelease\.' |
                head -n 1 ||
                true
            )
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD"
          fi

          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

          {
            echo "## What's changed"
            echo
            git log --reverse --pretty=format:'%s' "$COMMIT_RANGE" |
              awk -v version="$TARGET_VERSION" '$0 != version && $0 != "v" version { print "- " $0 }'
            echo
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  windows:
    name: Windows installer
    needs: version
    if: ${{ inputs.windows }}
    # better-sqlite3 is a native module compiled for the host, so the installer is built on Windows.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` (not `install`) so the lockfile decides the tree - a build meant for distribution
      # shouldn't silently pick up a newer transitive dependency than the one tested locally.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `-- --publish never` passes the flag through npm to electron-builder itself. It sees the CI
      # environment variables and assumes a build there is meant to be released, so it goes looking
      # for a GH_TOKEN and fails the job *after* the installer has already been built. Publishing
      # happens in the last job instead, from the artifact this produces.
      #
      # The installer is unsigned - there's no code-signing certificate here - so SmartScreen will
      # warn on first run until the download builds up reputation.
      - name: Build the installer
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
        run: npm run build -- --publish never

      - name: Rename the installer
        shell: bash
        run: |
          set -euo pipefail

          # Matched on the exact pattern rather than on any .exe: electron-builder also writes an
          # __uninstaller-nsis-*.exe into this directory while building, and picking that up would
          # publish a 200KB uninstaller as the release.
          shopt -s nullglob
          INSTALLERS=(release/hibiki-v*-setup.exe)
          if [ ${#INSTALLERS[@]} -ne 1 ] || [ ! -s "${INSTALLERS[0]}" ]; then
            echo "Expected exactly one installer in release/, found ${#INSTALLERS[@]}:"
            ls -la release || true
            exit 1
          fi

          # The built name carries package.json's version; a prerelease's differs, and the copy is
          # what puts the real one in front of the person downloading it.
          mkdir -p dist-release
          cp "${INSTALLERS[0]}" "dist-release/hibiki-v${{ needs.version.outputs.version }}-setup.exe"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/*.exe

  android:
    name: Android APK
    needs: version
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The web layer goes into the Android project's assets, as `npm run android:build` does.
      - name: Build the web layer and copy it into the Android project
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
        run: |
          npx vite build -c vite.android.config.ts
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the release keystore
        shell: bash
        env:
          HIBIKI_RELEASE_KEYSTORE_BASE64: ${{ secrets.HIBIKI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HIBIKI_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret: HIBIKI_RELEASE_KEYSTORE_BASE64 (base64 of the keystore file)."
            exit 1
          fi
          printf '%s' "$HIBIKI_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/hibiki-release.keystore
          if [ ! -s android/app/hibiki-release.keystore ]; then
            echo "Decoded keystore is empty. Check HIBIKI_RELEASE_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Build the signed APK
        shell: bash
        working-directory: android
        env:
          # Relative to android/app (see the signing block in android/app/build.gradle).
          HIBIKI_RELEASE_STORE_FILE: hibiki-release.keystore
          HIBIKI_RELEASE_STORE_PASSWORD: ${{ secrets.HIBIKI_RELEASE_STORE_PASSWORD }}
          HIBIKI_RELEASE_KEY_ALIAS: ${{ secrets.HIBIKI_RELEASE_KEY_ALIAS }}
          HIBIKI_RELEASE_KEY_PASSWORD: ${{ secrets.HIBIKI_RELEASE_KEY_PASSWORD }}
        run: |
          for name in HIBIKI_RELEASE_STORE_PASSWORD HIBIKI_RELEASE_KEY_ALIAS HIBIKI_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing GitHub secret: $name"; exit 1; fi
          done
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

      # Without the signing values the build quietly makes app-release-unsigned.apk; this is where a
      # release that would not install stops.
      - name: Verify the APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "Signed APK was not created: $APK"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist-release
          cp "$APK" "dist-release/hibiki-v${{ needs.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-release/*.apk

  publish:
    name: Create the GitHub Release
    needs: [version, windows, android]
    # Runs when every picked build succeeded; a build left out of the run is skipped, not failed.
    if: ${{ !cancelled() && needs.version.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body_path: artifacts/release-notes/release-notes.md
          files: |
            artifacts/windows/*.exe
            artifacts/android/*.apk
          prerelease: ${{ needs.version.outputs.is_prerelease }}
