name: Bug report
description: Report a reproducible problem in hibiki
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 1.2.0 (debug/release)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "e.g. Xiaomi 14, Android 15"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the source, anime title, episode, or feature involved.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Tap ...
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add relevant logs or attach a log export if available.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
    validations:
      required: false
