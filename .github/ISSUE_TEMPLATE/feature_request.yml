name: Feature request
description: Suggest an improvement for hibiki
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve hibiki.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What would you like to improve, and why?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think this could work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternative solutions or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add examples, screenshots, mockups, or links if they help explain the idea.
    validations:
      required: false
