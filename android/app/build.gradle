apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// One version for both builds: package.json's, the one the desktop app and the web layer already use.
// versionCode is derived from it (1.5.1 -> 10501), so it always grows as the version does.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).version as String
def appVersionCode = { String v ->
    def (major, minor, patch) = (v.tokenize("-+")[0].tokenize(".") + ["0", "0", "0"]).take(3).collect { it as int }
    major * 10000 + minor * 100 + patch
}(appVersion)

// Release signing: the Kotlin Hibiki's own key and the same variable names it reads, so its
// keystore and its GitHub secrets sign this build too. Each value comes from the environment (CI) or
// a Gradle property (~/.gradle/gradle.properties or -P); the store file is relative to android/app.
// Without all four, a release build is left unsigned rather than failing.
def releaseSigning = ["HIBIKI_RELEASE_STORE_FILE", "HIBIKI_RELEASE_STORE_PASSWORD", "HIBIKI_RELEASE_KEY_ALIAS", "HIBIKI_RELEASE_KEY_PASSWORD"]
    .collectEntries { [(it): System.getenv(it) ?: (project.findProperty(it) as String)] }
def hasReleaseSigning = releaseSigning.values().every { it }

android {
    namespace = "app.hibiki"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.akkirrai.hibiki"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigning.HIBIKI_RELEASE_STORE_FILE)
                storePassword releaseSigning.HIBIKI_RELEASE_STORE_PASSWORD
                keyAlias releaseSigning.HIBIKI_RELEASE_KEY_ALIAS
                keyPassword releaseSigning.HIBIKI_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        // Its own package, so a debug install sits next to the release one instead of blocking it
        // (the two are signed with different keys and cannot update each other).
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            // Off: APK sources link against the host's classes by name at run time (see app/hibiki/apk),
            // which R8 would rename or strip without keep rules for the whole extension API.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 5.x as the Kotlin Hibiki app resolves it (through ktor): several APK sources call its Duration API.
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    // --- APK sources: what Aniyomi extensions compile as compileOnly and resolve from the host. The
    // same libraries and versions as the Kotlin Hibiki app, whose host side this is (see
    // eu/kanade/tachiyomi and app/hibiki/apk) - a different version can break their linkage.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "io.reactivex:rxjava:1.3.8"
    implementation "com.github.null2264.injekt:injekt-core:4135455a2a"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.7.3"
    implementation "app.cash.quickjs:quickjs-android:0.9.2"
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-brotli:4.12.0"
    implementation "org.jsoup:jsoup:1.23.2"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Kotlin (the APK-source host) targets the same JVM level as Capacitor's Java (capacitor.build.gradle).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
